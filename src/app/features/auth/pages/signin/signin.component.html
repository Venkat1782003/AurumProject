<div class="auth-root">

  <!-- ═══════════════════════════════════════════════════════
       LEFT PANEL — brand / image side
  ════════════════════════════════════════════════════════════ -->
  <div class="panel-left">

    <!-- Swap the placeholder below for a real <img> when ready -->
    <!-- <img class="brand-image" src="assets/images/auth-hero.jpg" alt="AEC Platform"> -->

    <!-- Construction decorations (keep for now, remove when real image arrives) -->
    <div class="left-decor">
      <svg class="decor-building" viewBox="0 0 150 180" fill="none">
        <rect x="15" y="50" width="120" height="120" stroke="rgba(255,255,255,0.18)" stroke-width="2.5"/>
        <line x1="40"  y1="50" x2="40"  y2="170" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
        <line x1="65"  y1="50" x2="65"  y2="170" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
        <line x1="90"  y1="50" x2="90"  y2="170" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
        <line x1="115" y1="50" x2="115" y2="170" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
        <line x1="15"  y1="80"  x2="135" y2="80"  stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <line x1="15"  y1="110" x2="135" y2="110" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <line x1="15"  y1="140" x2="135" y2="140" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <rect x="25"  y="60" width="16" height="16" fill="rgba(255,255,255,0.12)"/>
        <rect x="50"  y="60" width="16" height="16" fill="rgba(255,255,255,0.12)"/>
        <rect x="75"  y="60" width="16" height="16" fill="rgba(255,255,255,0.12)"/>
        <rect x="100" y="60" width="16" height="16" fill="rgba(255,255,255,0.12)"/>
        <rect x="25"  y="90" width="16" height="16" fill="rgba(255,255,255,0.12)"/>
        <rect x="50"  y="90" width="16" height="16" fill="rgba(255,255,255,0.12)"/>
        <rect x="75"  y="90" width="16" height="16" fill="rgba(255,255,255,0.12)"/>
        <rect x="100" y="90" width="16" height="16" fill="rgba(255,255,255,0.12)"/>
      </svg>

      <svg class="decor-crane" viewBox="0 0 120 160" fill="none">
        <line x1="60" y1="15"  x2="60"  y2="110" stroke="rgba(255,255,255,0.22)" stroke-width="3"/>
        <line x1="60" y1="35"  x2="110" y2="35"  stroke="rgba(255,255,255,0.22)" stroke-width="3"/>
        <line x1="110" y1="35" x2="105" y2="140" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
        <circle cx="40" cy="130" r="10" stroke="rgba(255,255,255,0.2)" stroke-width="2.5"/>
        <circle cx="80" cy="130" r="10" stroke="rgba(255,255,255,0.2)" stroke-width="2.5"/>
        <rect x="50" y="105" width="20" height="18" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      </svg>
    </div>

    <!-- Brand block — logo + tagline always visible over the image -->
    <div class="left-brand">
      <div class="logo-mark">
        <svg viewBox="0 0 42 42" fill="none">
          <polygon points="21,3 39,12 39,30 21,39 3,30 3,12"
            fill="none" stroke="currentColor" stroke-width="2"/>
          <polygon points="21,10 33,17 33,27 21,34 9,27 9,17"
            fill="currentColor" opacity="0.8"/>
          <text x="21" y="26" text-anchor="middle" font-size="12"
            font-weight="800" fill="currentColor" font-family="Manrope,sans-serif">A</text>
        </svg>
      </div>
      <span class="brand-name">AEC Platform</span>
      <p class="brand-tagline">
        India's construction ecosystem —<br>
        connect, collaborate, build.
      </p>
    </div>

  </div>

  <!-- ═══════════════════════════════════════════════════════
       RIGHT PANEL — form side
  ════════════════════════════════════════════════════════════ -->
  <div class="panel-right">
    <div class="form-wrapper">

      <!-- Auth tabs -->
      <div class="auth-tabs">
        <a class="tab" routerLink="/auth/signin" routerLinkActive="active">Sign In</a>
        <a class="tab" routerLink="/auth/signup" routerLinkActive="active">Sign Up</a>
      </div>

      <!-- Form header -->
      <div class="form-header">
        <h1>Welcome back</h1>
        <p>Sign in to your AEC account to continue.</p>
      </div>

      <!-- Form -->
      <form [formGroup]="signinForm" (ngSubmit)="onSubmit()" novalidate autocomplete="off">

        <!-- Email -->
        <div class="field">
          <label>Email Address</label>
          <div class="input-box"
            [class.has-error]="hasError('email','required') || hasError('email','email')">
            <svg class="ico" viewBox="0 0 20 20" fill="none">
              <rect x="2" y="4.5" width="16" height="11" rx="2"
                stroke="currentColor" stroke-width="1.4"/>
              <path d="M2 7.5l8 5 8-5" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            <input type="email" formControlName="email" placeholder="you@example.com" />
          </div>
          <span class="hint-err" *ngIf="hasError('email','required')">Email is required</span>
          <span class="hint-err" *ngIf="hasError('email','email')">Enter a valid email</span>
        </div>

        <!-- Password -->
        <div class="field">
          <div class="label-row">
            <label>Password</label>
            <a class="forgot" routerLink="/auth/forgot">Forgot password?</a>
          </div>
          <div class="input-box" [class.has-error]="hasError('password','required')">
            <svg class="ico" viewBox="0 0 20 20" fill="none">
              <rect x="4" y="8.5" width="12" height="9" rx="2"
                stroke="currentColor" stroke-width="1.4"/>
              <path d="M7 8.5V6.5a3 3 0 016 0v2"
                stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <input [type]="showPwd ? 'text' : 'password'"
              formControlName="password" placeholder="Your password" />
            <button type="button" class="eye-btn" (click)="showPwd = !showPwd" tabindex="-1">
              <svg *ngIf="!showPwd" viewBox="0 0 20 20" fill="none">
                <path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z"
                  stroke="currentColor" stroke-width="1.4"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/>
              </svg>
              <svg *ngIf="showPwd" viewBox="0 0 20 20" fill="none">
                <path d="M3 3l14 14M8.5 8.8A2.5 2.5 0 0113.2 11.5M6 5.8C4 7 2.5 10 2.5 10s3 5.5 7.5 5.5a7 7 0 003.5-.9M10.5 4.5C14.5 4.5 17.5 10 17.5 10s-.8 1.5-2 3"
                  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <span class="hint-err" *ngIf="hasError('password','required')">Password is required</span>
        </div>

        <!-- API error -->
        <div class="api-error" *ngIf="errorMsg">
          <svg viewBox="0 0 20 20" fill="none" width="15" height="15">
            <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 6v4M10 13v.5" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round"/>
          </svg>
          {{ errorMsg }}
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="spin-ring"></span>
        </button>

        <!-- Divider -->
        <div class="or-divider"><span>or</span></div>

        <!-- Google -->
        <button type="button" class="btn-google" (click)="onGoogleSignIn()">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

      </form>
    </div>
  </div>

</div>
