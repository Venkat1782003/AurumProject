<div class="profile-page">
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">A</span>
      <div class="brand-text">
        <span class="brand-name">AEC</span>
        <span class="brand-sub">PLATFORM</span>
      </div>
    </div>
  </header>

  <main class="profile-content">
    <section class="profile-panel">
      <div class="panel-header">
        <span class="badge">Professional Info</span>
        <h1>Professional details</h1>
        <p class="subtitle">Keep your contact details and company information current.</p>
      </div>

      <form (ngSubmit)="saveProfile()" #profileForm="ngForm">
        <div class="form-row-group">
          <div class="form-row">
            <label for="name">Full Name</label>
            <input id="name" type="text" [(ngModel)]="profile.name" name="name" placeholder="Jane Doe" required>
          </div>

          <div class="form-row">
            <label for="company">Company</label>
            <input id="company" type="text" [(ngModel)]="profile.company" name="company" placeholder="Your company name">
          </div>
        </div>

        <div class="form-row-group">
          <div class="form-row">
            <label for="role">Role</label>
            <select id="role" [(ngModel)]="selectedRole" name="role" (change)="changeRole(selectedRole)">
              <option *ngFor="let option of roleOptions" [ngValue]="option.value">
                {{ option.label }}
              </option>
            </select>
          </div>

          <div class="form-row">
            <label for="phone">Phone Number</label>
            <input id="phone" type="tel" [(ngModel)]="profile.phone" name="phone" placeholder="+91 00000 00000">
          </div>
        </div>

        <div class="sub1-block" *ngIf="uiStage === 'sub1'">
          <div class="section-title-row">
            <span class="section-title">Discipline</span>
            <span class="section-note">Select a discipline to begin</span>
          </div>

          <div class="sub1-list">
            <button
              type="button"
              class="sub1-button"
              *ngFor="let option of availableSub1Options"
              (click)="selectSub1(option.value)">
              {{ option.label }}
            </button>
          </div>
        </div>

        <div class="sub2-block" *ngIf="uiStage === 'sub2' && activeSub1">
          <div class="sub2-list">
            <button
              type="button"
              class="sub2-button"
              [class.active]="activeSub2 === option.value"
              *ngFor="let option of allSub2Options"
              (click)="selectSub2(option.value)">
              {{ option.label }}
            </button>
          </div>
        </div>

        <div class="sub3-block" *ngIf="uiStage === 'sub3' && activeSub1 && activeSub2">
          <div class="sub3-toolbar">
            <button type="button" class="secondary-btn" (click)="goBackToSub2()">Back to {{ getSub1Label(activeSub1) }}</button>
          </div>

          <div class="sub3-grid">
            <div class="sub3-card" *ngFor="let option of sub3Options" [class.selected]="isSub3Selected(option.value)">
              <div class="sub3-card-top">
                <div class="sub3-icon-frame">
                  <button type="button" class="sub3-icon" (click)="toggleSub3(option.value)" [attr.aria-label]="getProjectTypeLabel(option.value)" [title]="getProjectTypeLabel(option.value)">
                    <span class="icon">{{ getSub3Icon(option.value) }}</span>
                  </button>
                  <div class="sub3-label">{{ getProjectTypeLabel(option.value) }}</div>
                  <label class="upload-label">
                    <input type="file" accept="image/*" multiple (change)="handleFileInput($event, option.value)" />
                    Show your work
                  </label>
                </div>
              </div>

              <div class="photo-thumbs">
                <div class="thumb" *ngFor="let img of getPhotos(option.value); let i = index">
                  <img [src]="img" alt="photo {{i+1}}">
                  <button type="button" class="thumb-remove" (click)="removePhoto(option.value, i)">×</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="primary-btn" [disabled]="saving || !profileForm.valid">
            {{ saving ? 'Saving...' : 'Save & Continue' }}
          </button>
          <button type="button" class="link-btn" (click)="skipForNow()">Skip for now</button>
        </div>
      </form>
    </section>
  </main>
</div>
